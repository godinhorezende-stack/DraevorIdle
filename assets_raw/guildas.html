<div class="faixa-teste">
  <span data-t="faixa.teste">Servidor de teste · em desenvolvimento — vai haver bugs</span>

<main class="pagina-interna">
  <!-- =======================================================================
       DUAS TELAS NUMA PAGINA SO'

       A lista de guildas e a ficha de UMA guilda sao a mesma pagina, e trocam
       pelo endereco (`/guildas` e `/guildas?nome=...`). Duas paginas dariam dois
       cabecalhos, dois rodapes e duas copias do menu para manter iguais — e a
       segunda so' existiria para mostrar uma tabela a mais.
       ======================================================================= -->
  <section class="bloco" id="tela-lista">
    <div class="bloco-cabeca">
      <h2>Guildas</h2>
      <p class="legenda">
        <b id="quantas">—</b> <span id="quantas-rotulo">guildas</span> no servidor.
        Clique numa para ver os membros.
      </p>
    </div>

    <div class="tabela-caixa">
      <table class="tabela">
        <thead>
          <tr>
            <th class="brasao-col"></th>
            <th>Guilda</th>
            <th>Líder</th>
            <th class="num">Membros</th>
            <th class="num">Pontos</th>
          </tr>
        </thead>
        <tbody id="lista-guildas">
          <tr><td colspan="5" class="vazio">carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="bloco" id="tela-ficha" hidden>
    <a class="voltar-guildas" href="/guildas">&larr; todas as guildas</a>
    <div class="guilda-cabeca" id="guilda-cabeca"></div>

    <div class="tabela-caixa">
      <table class="tabela">
        <thead>
          <tr>
            <th class="retrato-col"></th>
            <th>Membro</th>
            <th>Posto</th>
            <th>Vocação</th>
            <th class="num">Level</th>
          </tr>
        </thead>
        <tbody id="lista-membros">
          <tr><td colspan="5" class="vazio">carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
