<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- O slot VAZIO do cinto (sistema de itens do PoE: o cinto vai no slot `legs`): a mesma paleta escura das outras artes de slot. -->
  <rect width="34" height="34" fill="#22272b"/>
  <rect x="1" y="1" width="32" height="32" fill="none" stroke="#0f1418" stroke-width="2"/>
  <!-- a correia -->
  <path d="M3 14 Q17 11 31 14 V20 Q17 17 3 20 Z" fill="#3a4246" stroke="#656b6e" stroke-width="1" stroke-linejoin="round"/>
  <!-- a fivela -->
  <rect x="12.5" y="11.5" width="9" height="10" rx="1" fill="none" stroke="#7a8083" stroke-width="1.6"/>
  <path d="M17 12.5 V20.5" stroke="#7a8083" stroke-width="1.4"/>
  <!-- os furos -->
  <circle cx="25" cy="16.3" r="0.9" fill="#1c2023"/>
  <circle cx="28" cy="16.6" r="0.9" fill="#1c2023"/>
</svg>
