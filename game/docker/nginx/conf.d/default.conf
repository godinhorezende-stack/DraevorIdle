# O jogo já serve tudo comprimido/com cache (ver server/nucleo/estaticos.mjs)
# — o nginx aqui NÃO recomprime nem cacheia por conta própria (evitaria
# gzip-em-cima-de-gzip e um Cache-Control errado por cima do certo). O
# trabalho dele é: TLS, WebSocket com Upgrade, e limitar abuso por IP antes de
# chegar no Node.

# Zonas de limite (por IP) — 10 MB de estado dá pra ~160 mil IPs distintos.
limit_req_zone $binary_remote_addr zone=http_por_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexoes_por_ip:10m;

# Upgrade -> Connection: o valor certo do cabeçalho é "upgrade" só quando o
# cliente pediu upgrade (WebSocket); em qualquer outro request tem que ir
# vazio, senão toda resposta normal vira "Connection: close".
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---- :80, sem TLS — o padrão deste repo (sem domínio/certificado ainda) ----
# Serve o jogo direto. `/.well-known/acme-challenge/` continua respondendo
# mesmo assim: é o que o certbot usa para provar dono do domínio na 1ª vez
# (ver docs/deploy.md, "Ligar TLS"), antes de existir qualquer certificado.
server {
  # Só IPv4: o Docker não publica IPv6 por padrão (precisa de rede ipv6
  # explícita no daemon) — `listen [::]:80` sem isso derruba o nginx na
  # subida em vez de só avisar, em várias instalações Docker por aí.
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  include /etc/nginx/conf.d/game.conf.inc;
}

# ---- :443, com TLS — descomente DEPOIS que o certbot gerar o certificado ----
# Troque SEU_DOMINIO pelo domínio de verdade nas duas linhas de ssl_certificate*
# e, no bloco de cima, troque o `include game.conf.inc` por
# `return 301 https://$host$request_uri;` para forçar HTTPS.
#
# server {
#   listen 443 ssl;
#   http2 on;
#   server_name SEU_DOMINIO;
#
#   ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_ciphers HIGH:!aNULL:!MD5;
#   ssl_session_cache shared:SSL:10m;
#
#   include /etc/nginx/conf.d/game.conf.inc;
# }
