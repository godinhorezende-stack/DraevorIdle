# Base: nginx + game + postgres, prontos para staging OU produção num único
# VPS (ver docs/deploy.md). Redis fica atrás de um profile — o jogo hoje é um
# processo só, então (como o próprio docs/auditoria-performance.md, Fase 6,
# registra) Redis só entra quando existir um SEGUNDO processo/máquina
# (presença, pub/sub, rate limit compartilhado). Até lá, subir Redis seria
# manter um serviço em produção sem nada consumindo.
#
# Uso (de dentro de game/docker/):
#   cp .env.example .env && editar
#   docker compose up -d --build
#   docker compose --profile scale up -d        # só quando precisar do redis
name: draevoridle
services:
  game:
    build:
      # Contexto na raiz do repo (dois níveis acima de game/docker/): é onde
      # moram o package.json e os game/* de código — ver o Dockerfile.
      context: ../..
      dockerfile: game/docker/Dockerfile
    image: draevoridle-game
    restart: unless-stopped
    environment:
      PORTA: ${PORTA:-8080}
      DATABASE_URL: ${DATABASE_URL}
      # Vazia por padrão: sem o profile "scale" (que sobe o redis) isto fica
      # em branco e o jogo roda sem cache nenhum, como sempre — ver
      # game/database/redis.mjs.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Somente leitura: o jogo só lê estes três (client extraído, o
      # conteúdo/sprites e o JSON do servidor original) — um `git pull` no
      # host já atualiza sem rebuild.
      - ../frontend:/app/game/frontend:ro
      - ../gamedata:/app/game/gamedata:ro
      - ../../api-mapeada:/app/api-mapeada:ro
      # Só é usado se DATABASE_URL vier vazio (cai para SQLite) — mantido por
      # segurança num ambiente de teste sem Postgres configurado ainda.
      - dados_sqlite:/app/game/database/dados
    depends_on:
      postgres:
        condition: service_healthy
    # Tempo para o handler de SIGTERM (game/backend/index.mjs) gravar todo
    # mundo que está online antes do container ser morto de vez.
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env — ver .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-jogo}
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jogo} -d ${POSTGRES_DB:-jogo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - game

  # Presença/pub-sub/rate-limit compartilhado entre processos — desligado por
  # padrão (profile "scale"). Nenhum código do jogo fala com ele ainda.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["scale"]
    volumes:
      - redis_dados:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_dados:
  dados_sqlite:
  redis_dados:
